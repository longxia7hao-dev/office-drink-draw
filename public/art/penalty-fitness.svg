<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- sticker shadow -->
  <rect x="28" y="32" width="200" height="200" rx="28" fill="#111" opacity="0.35" transform="rotate(3 128 128)"/>
  <!-- sticker body -->
  <rect x="24" y="24" width="200" height="200" rx="28" fill="#1a0a2e" stroke="#ff6b00" stroke-width="8" filter="url(#glow)" transform="rotate(-4 128 128)"/>
  <!-- tape -->
  <rect x="88" y="12" width="80" height="22" rx="3" fill="#ffd76a" opacity="0.9" transform="rotate(-6 128 23)"/>
  <!-- neon drip accents -->
  <path d="M40 60 Q48 90 42 110" stroke="#ff6b00" stroke-width="4" fill="none" opacity="0.7"/>
  <path d="M210 70 Q218 100 208 130" stroke="#ff2bd6" stroke-width="3" fill="none" opacity="0.55"/>
  <!-- glyph -->
  <text x="128" y="128" text-anchor="middle" dominant-baseline="central" font-size="92" font-family="Arial Black, Impact, sans-serif">💪</text>
  <!-- label -->
  <text x="128" y="198" text-anchor="middle" fill="#ff6b00" font-size="22" font-family="Arial Black, Impact, sans-serif" letter-spacing="1">健身</text>
</svg>
